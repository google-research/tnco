name: C++ Linter

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'scripts/cpp_linter.sh'
      - 'scripts/*.cmake'
      - 'CMakeLists.txt'
      - '.clang-tidy'
      - '.github/workflows/cpp_linter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'include/**'
      - 'scripts/cpp_linter.sh'
      - 'scripts/*.cmake'
      - 'CMakeLists.txt'
      - '.clang-tidy'
      - '.github/workflows/cpp_linter.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install baseline
      run: |
        sudo apt -y update
        sudo apt -y upgrade
        sudo apt -y install cmake \
                            g++ \
                            libmpfr-dev \
                            python3-dev \
                            python3-pybind11 \
                            libboost-dev \
                            libmpfr6 \
                            parallel

    - name: Build
      run: |
        cmake -B build/ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug

    - name: Call linter
      run: |
        pip install -U $(bash scripts/cpp_linter.sh --config)
        bash scripts/cpp_linter.sh --build build/
